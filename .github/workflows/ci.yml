name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://bamak:bamak@localhost:5432/bamak?schema=public

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bamak
          POSTGRES_PASSWORD: bamak
          POSTGRES_DB: bamak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bamak -d bamak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Validar Prisma
        run: npx prisma validate

      - name: Aplicar migrações no PostgreSQL de CI
        run: npx prisma migrate deploy

      - name: Testar integridade do domínio e rollback
        env:
          PGPASSWORD: bamak
        run: psql -h 127.0.0.1 -p 5432 -U bamak -d bamak -X -v ON_ERROR_STOP=1 -f test/integration/domain-integrity.sql

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Testes e cobertura
        env:
          RUN_DB_INTEGRATION: "1"
        run: npm run test:cov -- --runInBand --ci

      - name: Publicar cobertura da API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-api
          path: apps/api/coverage/lcov.info
          if-no-files-found: ignore

  web:
    name: Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Testes e cobertura
        run: npm run test:cov

      - name: Publicar cobertura da Web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-web
          path: apps/web/coverage/lcov.info
          if-no-files-found: ignore

  deploy_scripts:
    name: Scripts de deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validar workflows com Actionlint
        run: |
          docker run --rm --pull=missing --network none \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --workdir /work rhysd/actionlint:1.7.12 \
            .github/workflows/ci.yml .github/workflows/deploy.yml

      - name: Testar permissoes da imagem Prisma
        run: sh infra/deploy/test-migration-image-permissions.sh

      - name: Validar scripts e testar deploy
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --workdir /work alpine:3.21 sh -eu -c '
              sh -n infra/deploy/ssh-gate.sh
              sh -n infra/deploy/bamak-deploy.sh
              sh -n infra/deploy/test-ssh-gate.sh
              sh -n infra/deploy/test-bamak-deploy.sh
              sh infra/deploy/test-ssh-gate.sh
              sh infra/deploy/test-bamak-deploy.sh
              sh -n infra/deploy/prepare-domain-migrations.sh
              sh -n infra/deploy/test-prepare-domain-migrations.sh
              sh infra/deploy/test-prepare-domain-migrations.sh
              sh -n infra/backup/backup-postgres.sh
              sh -n infra/backup/test-backup-postgres.sh
              sh -n infra/backup/install-backup.sh
              sh infra/backup/test-backup-postgres.sh
            '

      - name: Testar backup e restauracao PostgreSQL
        run: sudo sh infra/backup/test-backup-postgres-integration.sh

  sonar_api:
    needs: [api]
    name: SonarQube API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Instalar dependencias
        working-directory: apps/api
        run: npm ci
      - name: Recuperar cobertura da API
        uses: actions/download-artifact@v4
        with:
          name: cobertura-api
          path: apps/api/coverage

      - name: Analisar API
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          projectBaseDir: apps/api
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  sonar_web:
    needs: [web]
    name: SonarQube Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar dependencias
        working-directory: apps/web
        run: npm ci
      - name: Recuperar cobertura da Web
        uses: actions/download-artifact@v4
        with:
          name: cobertura-web
          path: apps/web/coverage

      - name: Analisar Web
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          projectBaseDir: apps/web
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
