name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://bamak:bamak@localhost:5432/bamak?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Validar Prisma
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  web:
    name: Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy_scripts:
    name: Scripts de deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validar scripts e testar deploy
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --workdir /work alpine:3.21 sh -eu -c '
              sh -n infra/deploy/ssh-gate.sh
              sh -n infra/deploy/bamak-deploy.sh
              sh -n infra/deploy/test-ssh-gate.sh
              sh -n infra/deploy/test-bamak-deploy.sh
              sh infra/deploy/test-ssh-gate.sh
              sh infra/deploy/test-bamak-deploy.sh
            '
